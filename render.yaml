# Render Blueprint — deploy backend ขึ้น Render ได้ HTTPS อัตโนมัติ
# ใช้: Render Dashboard -> New -> Blueprint -> เลือก repo นี้
# หลัง deploy: ใส่ env DATABASE_URL ใน dashboard (pooler :6543 ห้ามใช้ direct :5432)
services:
  - type: web
    name: ups-regis-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /admin/config
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
